server.port=8080
server.error.whitelabel.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.git.mode=full

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%{X-Correlation-Id}o %h %l %u %t "%r" %s %b %D

# Shared secret required (as "Authorization: Bearer <token>") on mutating /api/** requests.
# Leave blank to disable the check, e.g. for local development. Set via ROVER_API_TOKEN.
rover.api.token=${ROVER_API_TOKEN:}

# /api/stream: how long to keep an idle stream open with no frames, and how often to check.
rover.stream.idle-timeout-ms=5000
rover.stream.poll-interval-ms=100
