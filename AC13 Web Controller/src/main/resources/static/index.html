<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AC13 Web Controller</title>
  <style>
    :root {
      --bg: #111218;
      --panel: #1a1d27;
      --accent: #5cd6ff;
      --warn: #ffd166;
      --text: #eef2ff;
      --muted: #9da8c8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 700px at 20% -10%, #273350 0, var(--bg) 55%);
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
    }

    .wrap {
      width: min(980px, 100%);
      background: color-mix(in srgb, var(--panel), black 15%);
      border: 1px solid #2a3145;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #131722;
      border-bottom: 1px solid #2a3145;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b7280;
    }

    .status[data-state="connected"]::before { background: #34d399; }
    .status[data-state="busy"]::before { background: var(--warn); }
    .status[data-state="error"]::before { background: #f87171; }

    .message {
      min-height: 1.2em;
      margin: 0;
      font-size: 13px;
      color: #fca5a5;
    }

    .video { position: relative; }

    .video img:not([src]) { visibility: hidden; }

    .video .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .video .overlay[hidden] { display: none; }

    main {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
      padding: 16px;
    }

    .video {
      background: #0a0c12;
      border-radius: 14px;
      border: 1px solid #262c3d;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }

    .video img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .panel {
      background: #121624;
      border: 1px solid #262c3d;
      border-radius: 14px;
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      color: #0d1320;
      background: var(--accent);
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.alt { background: #8cc7ff; }
    button.warn { background: var(--warn); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .dpad button { background: #6bd3ff; }
    .dpad button.active { background: #36b7f0; box-shadow: inset 0 0 0 2px #0f6f96; }
    .dpad .empty { visibility: hidden; }

    .hint {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AC13 Web Controller</h1>
    <div class="status" id="status" data-state="idle" role="status" aria-live="polite">Disconnected</div>
  </header>
  <main>
    <div class="video">
      <img id="stream" alt="Rover stream">
      <div class="overlay" id="overlay">Not connected</div>
    </div>
    <div class="panel">
      <div class="grid">
        <button id="connect">Connect</button>
        <button class="alt" id="disconnect">Disconnect</button>
      </div>
      <button class="warn" id="infrared">Toggle Infrared</button>
      <button class="warn" id="stop">Stop</button>

      <div class="dpad">
        <div class="empty"></div>
        <button data-move="forward">Forward</button>
        <div class="empty"></div>
        <button data-move="left">Left</button>
        <button data-move="backward">Backward</button>
        <button data-move="right">Right</button>
      </div>
      <p class="message" id="message" role="alert"></p>
      <p class="hint">Keyboard: W A S D or Arrow Keys. Hold to accelerate command rate.</p>
    </div>
  </main>
</div>

<script>
  const statusEl = document.getElementById('status');
  const messageEl = document.getElementById('message');
  const streamEl = document.getElementById('stream');
  const overlayEl = document.getElementById('overlay');
  const connectBtn = document.getElementById('connect');
  const disconnectBtn = document.getElementById('disconnect');
  const infraredBtn = document.getElementById('infrared');
  const stopBtn = document.getElementById('stop');
  const moveButtons = Object.fromEntries(
    Array.from(document.querySelectorAll('[data-move]')).map((btn) => [btn.dataset.move, btn])
  );
  const TOKEN_KEY = 'rover-api-token';
  let activeMove = null;
  let moveLoopTimer = null;
  let moveStartTime = 0;
  let connected = false;
  let busy = false;
  let streamRetryTimer = null;

  function readToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; }
  }

  function saveToken(token) {
    try { localStorage.setItem(TOKEN_KEY, token); } catch { /* storage unavailable */ }
  }

  let apiToken = readToken();

  async function call(path, method = 'POST', retried = false) {
    const headers = {};
    if (method !== 'GET' && apiToken) headers.Authorization = `Bearer ${apiToken}`;
    const res = await fetch(path, { method, headers });
    if (res.status === 401 && !retried) {
      const entered = window.prompt('This rover controller needs an API token:');
      if (entered) {
        apiToken = entered.trim();
        saveToken(apiToken);
        return call(path, method, true);
      }
    }
    const body = res.headers.get('content-type')?.includes('application/json') ? await res.json() : null;
    if (!res.ok) {
      const err = new Error(body?.message || `${method} ${path} failed (${res.status})`);
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return body;
  }

  function showMessage(text) {
    messageEl.textContent = text || '';
  }

  function render(data) {
    connected = Boolean(data?.connected);
    if (busy) {
      statusEl.dataset.state = 'busy';
    } else if (data === null) {
      statusEl.dataset.state = 'error';
      statusEl.textContent = 'Controller unavailable';
    } else {
      statusEl.dataset.state = connected ? 'connected' : 'idle';
      statusEl.textContent = connected
        ? `Connected | Stream: ${data.streaming ? 'on' : 'off'} | IR: ${data.infrared}`
        : 'Disconnected';
    }

    const controlsEnabled = connected && !busy;
    connectBtn.disabled = connected || busy || data === null;
    disconnectBtn.disabled = !connected || busy;
    infraredBtn.disabled = !controlsEnabled;
    stopBtn.disabled = !controlsEnabled;
    Object.values(moveButtons).forEach((btn) => { btn.disabled = !controlsEnabled; });
    if (!controlsEnabled) stopMove();

    syncStream();
  }

  function syncStream() {
    if (connected) {
      overlayEl.hidden = true;
      if (!streamEl.getAttribute('src')) startStream();
    } else {
      clearTimeout(streamRetryTimer);
      streamEl.removeAttribute('src');
      overlayEl.textContent = 'Not connected';
      overlayEl.hidden = false;
    }
  }

  function startStream() {
    clearTimeout(streamRetryTimer);
    streamEl.src = `/api/stream?t=${Date.now()}`;
  }

  // The server ends an idle stream; retry while still connected.
  streamEl.addEventListener('error', () => {
    if (!connected) return;
    overlayEl.textContent = 'Stream interrupted, reconnecting…';
    overlayEl.hidden = false;
    streamEl.removeAttribute('src');
    clearTimeout(streamRetryTimer);
    streamRetryTimer = setTimeout(() => { if (connected) startStream(); }, 2000);
  });
  streamEl.addEventListener('load', () => { overlayEl.hidden = true; });

  async function refreshStatus() {
    try {
      render(await call('/api/status', 'GET'));
    } catch {
      render(null);
    }
  }

  async function runAction(label, path) {
    busy = true;
    statusEl.textContent = label;
    render({ connected });
    showMessage('');
    try {
      await call(path);
    } catch (err) {
      showMessage(err.status === 502 ? 'Could not reach the rover. Is this computer on its Wi-Fi?' : err.message);
    } finally {
      busy = false;
      await refreshStatus();
    }
  }

  connectBtn.addEventListener('click', () => runAction('Connecting…', '/api/connect'));
  disconnectBtn.addEventListener('click', () => runAction('Disconnecting…', '/api/disconnect'));
  infraredBtn.addEventListener('click', () => runAction('Switching infrared…', '/api/infrared/toggle'));
  stopBtn.addEventListener('click', () => call('/api/stop').catch((err) => showMessage(err.message)));

  function moveLoopDelay(elapsedMs) {
    if (elapsedMs < 600) return 220;
    if (elapsedMs < 1800) return 150;
    if (elapsedMs < 3500) return 95;
    return 65;
  }

  function setActiveButton(move) {
    Object.values(moveButtons).forEach((btn) => btn.classList.remove('active'));
    if (move && moveButtons[move]) {
      moveButtons[move].classList.add('active');
    }
  }

  function queueMoveLoop() {
    if (!activeMove) return;
    clearTimeout(moveLoopTimer);
    const elapsed = Date.now() - moveStartTime;
    moveLoopTimer = setTimeout(async () => {
      if (!activeMove) return;
      try {
        await call(`/api/move/${activeMove}`);
      } catch {
      }
      queueMoveLoop();
    }, moveLoopDelay(elapsed));
  }

  function startMove(move) {
    if (activeMove === move || !connected || busy) return;
    activeMove = move;
    moveStartTime = Date.now();
    setActiveButton(move);
    call(`/api/move/${move}`).catch(() => {});
    queueMoveLoop();
  }

  function stopMove() {
    if (!activeMove) return;
    activeMove = null;
    clearTimeout(moveLoopTimer);
    setActiveButton(null);
    call('/api/stop').catch(() => {});
  }

  Object.entries(moveButtons).forEach(([cmd, btn]) => {
    btn.addEventListener('mousedown', () => startMove(cmd));
    btn.addEventListener('mouseup', stopMove);
    btn.addEventListener('mouseleave', stopMove);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startMove(cmd); }, { passive: false });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); stopMove(); }, { passive: false });
    btn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopMove(); }, { passive: false });
  });

  const keyToMove = {
    ArrowUp: 'forward',
    ArrowDown: 'backward',
    ArrowLeft: 'left',
    ArrowRight: 'right',
    w: 'forward',
    s: 'backward',
    a: 'left',
    d: 'right'
  };

  document.addEventListener('keydown', (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const move = keyToMove[key];
    if (!move) return;
    e.preventDefault();
    if (e.repeat && activeMove === move) return;
    startMove(move);
  });

  document.addEventListener('keyup', (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const move = keyToMove[key];
    if (!move) return;
    e.preventDefault();
    if (activeMove === move) stopMove();
  });

  window.addEventListener('blur', stopMove);

  refreshStatus();
  setInterval(refreshStatus, 2000);
</script>
</body>
</html>
